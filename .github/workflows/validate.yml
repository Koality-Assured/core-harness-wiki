name: Validate Content & Manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint & Validate Wiki Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Validate Markdown & Frontmatter
        run: node docs/scripts/validate-content.mjs

      - name: Rebuild Manifest Test
        run: node docs/scripts/build-manifest.mjs

      - name: Run Invariant Tests
        run: node --test docs/scripts/invariants.test.mjs

      - name: Ensure Site Content Sync
        run: |
          node docs/scripts/sync-site-content.mjs
          git restore docs/manifest.json
          git diff --exit-code
