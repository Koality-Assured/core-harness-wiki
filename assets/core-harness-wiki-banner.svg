<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#3B82F6" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#3B82F6" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Interactive Knowledge Wiki Motif -->
    <path d="M 256 180 C 220 160 170 160 140 175 V 335 C 170 320 220 320 256 340 C 292 320 342 320 372 335 V 175 C 342 160 292 160 256 180 Z" 
          fill="none" stroke="#00F0FF" stroke-width="5" stroke-linejoin="round" />
    <line x1="256" y1="180" x2="256" y2="340" stroke="#3B82F6" stroke-width="4" />
    <!-- Knowledge Nodes on Left Page -->
    <circle cx="180" cy="220" r="6" fill="#3B82F6" />
    <circle cx="220" cy="250" r="6" fill="#10B981" />
    <circle cx="180" cy="280" r="6" fill="#00F0FF" />
    <line x1="180" y1="220" x2="220" y2="250" stroke="#3B82F6" stroke-width="2" />
    <line x1="220" y1="250" x2="180" y2="280" stroke="#10B981" stroke-width="2" />
    <!-- Article Text Lines on Right Page -->
    <line x1="280" y1="215" x2="345" y2="215" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="240" x2="335" y2="240" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="265" x2="350" y2="265" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="290" x2="320" y2="290" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    <!-- Top Knowledge Nexus Beacon -->
    <polygon points="256,140 264,155 256,170 248,155" fill="#10B981" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#00F0FF" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • STATIC WIKI ENGINE</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">CORE HARNESS WIKI</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Universal Zero-Dependency Static Documentation Wiki &amp; Knowledge Base Engine</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Zero-Dependency -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#00F0FF" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#00F0FF" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Zero-Dependency</text>
      </g>
      <!-- Chip 2: Fluid Widescreen -->
      <g transform="translate(197, 0)">
        <rect x="0" y="0" width="192" height="38" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#3B82F6" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Fluid Widescreen</text>
      </g>
      <!-- Chip 3: Static Engine -->
      <g transform="translate(403, 0)">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Static Engine</text>
      </g>
      <!-- Chip 4: Fast Manifest -->
      <g transform="translate(582, 0)">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Fast Manifest</text>
      </g>
    </g>
  </g>
</svg>
