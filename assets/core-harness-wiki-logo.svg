<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#00F0FF" />
    <circle cx="256" cy="71" r="5" fill="#00F0FF" />
    <circle cx="441" cy="256" r="14" stroke="#3B82F6" />
    <circle cx="441" cy="256" r="5" fill="#3B82F6" />
    <circle cx="256" cy="441" r="14" stroke="#10B981" />
    <circle cx="256" cy="441" r="5" fill="#10B981" />
    <circle cx="71" cy="256" r="14" stroke="#00F0FF" />
    <circle cx="71" cy="256" r="5" fill="#00F0FF" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Interactive Knowledge Wiki Motif -->
    <path d="M 256 180 C 220 160 170 160 140 175 V 335 C 170 320 220 320 256 340 C 292 320 342 320 372 335 V 175 C 342 160 292 160 256 180 Z" 
          fill="none" stroke="#00F0FF" stroke-width="5" stroke-linejoin="round" />
    <line x1="256" y1="180" x2="256" y2="340" stroke="#3B82F6" stroke-width="4" />
    <!-- Knowledge Nodes on Left Page -->
    <circle cx="180" cy="220" r="6" fill="#3B82F6" />
    <circle cx="220" cy="250" r="6" fill="#10B981" />
    <circle cx="180" cy="280" r="6" fill="#00F0FF" />
    <line x1="180" y1="220" x2="220" y2="250" stroke="#3B82F6" stroke-width="2" />
    <line x1="220" y1="250" x2="180" y2="280" stroke="#10B981" stroke-width="2" />
    <!-- Article Text Lines on Right Page -->
    <line x1="280" y1="215" x2="345" y2="215" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="240" x2="335" y2="240" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="265" x2="350" y2="265" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="290" x2="320" y2="290" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    <!-- Top Knowledge Nexus Beacon -->
    <polygon points="256,140 264,155 256,170 248,155" fill="#10B981" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#10B981" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#00F0FF" filter="url(#glow)" />
</svg>
