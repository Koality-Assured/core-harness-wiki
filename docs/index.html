  <!-- Determine base path for project sites (e.g. /core-harness-wiki/) -->
  <script>
    (function () {
      var p = window.location.pathname || '/';

      p = p.replace(/\/+$/, '');
      window.WIKI_CONTENT_BASE = p || '';
    })();
  </script>
